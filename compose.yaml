services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: purchase_platform
      MYSQL_USER: purchase
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=tcp -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
          -D "$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 4s
      start_period: 45s
      retries: 12
    networks: [backend]

  api:
    image: "${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY in .env}:${IMAGE_TAG:?Set IMAGE_TAG in .env}-api"
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: mysql://purchase:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/purchase_platform
      PORT: '3001'
      TZ: Asia/Shanghai
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?Set INTERNAL_JOB_TOKEN in .env}
    volumes:
      - buyer_uploads:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend, edge]

  web:
    image: "${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY in .env}:${IMAGE_TAG:?Set IMAGE_TAG in .env}-web"
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
  backend:
    internal: true

volumes:
  mysql_data:
  buyer_uploads:
  caddy_data:
  caddy_config:
