name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version (for example, v1.0.0)
        required: true
        type: string
        default: v1.0.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          target: api
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/purchase-platform:${{ inputs.version }}-api

      - name: Build and push Web
        uses: docker/build-push-action@v7
        with:
          target: web
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/purchase-platform:${{ inputs.version }}-web
